name: Nightly Manual Release Build

# STABLE builds — builds via the reusable _build.yml (same matrix build as the
# artifacts-only workflow), then a second job downloads the flavor artifacts and
# publishes the GitHub release + update.json. A release is ONLY produced here.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Short in-app update line (optional; otherwise taken from docs/releases/<number>.md)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (e.g. 1.7, 1.8)'
        required: true
        default: '1.0'
      release_title:
        description: 'Release title (e.g. Bannerlator 1.0)'
        required: true
        default: 'Bannerlator 1.0'
      release_number:
        description: 'Release number for APK name (e.g. 1.7, 1.9-pre1)'
        required: true
        default: '1.0'
      make_prerelease:
        description: 'Pre-release? (true = beta build, not offered to stable users)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  # Phase 0 — the release description, checked BEFORE the ~20 min build so a bad notes
  # file fails in seconds. Every release page uses the house layout: the full notes from
  # docs/releases/<number>.md (required for a stable cut, layout checked) plus the complete
  # list of work merged since the previous stable. See scripts/release_notes.py.
  notes:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository (full history + tags, for the change list)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Assemble the release description
      env:
        FALLBACK_NOTES: ${{ inputs.release_notes }}
        RELEASE_TITLE: ${{ inputs.release_title }}
      run: |
        ARGS=("${{ inputs.release_number }}" --title "$RELEASE_TITLE" --fallback "$FALLBACK_NOTES")
        [ "${{ inputs.make_prerelease }}" = "true" ] && ARGS+=(--prerelease)
        python3 scripts/release_notes.py "${ARGS[@]}"
        { echo "### In-app update line"; echo; cat short-notes.txt; echo;
          echo "### In-app update highlights"; echo; echo '```json'; cat highlights.json; echo '```'; echo;
          echo "### Release description"; echo; cat release-body.md; } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep it for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: |
          release-body.md
          short-notes.txt
          highlights.json
        retention-days: 7

  # Phase 1 — build all 4 flavors in parallel (reusable matrix build).
  build:
    needs: notes
    uses: ./.github/workflows/_build.yml
    with:
      release_number: ${{ inputs.release_number }}

  # Phase 1b — small in-app updates. One job per flavor: a direct patch from each of the last
  # PATCH_FROM app releases (stable and pre) to the new APK, each one applied back and checked
  # byte-exact before it is kept. Keyed by the OLD APK's sha256, never by versionCode (dev
  # builds freeze it). Old releases without this flavor (antutu before 3.1.6-pre1) and
  # non-app releases (fex-2609-r3) have no matching asset and are skipped. A patch failure
  # never blocks the release: that flavor just keeps full-size updates. See scripts/apk_delta.py.
  patches:
    needs: build
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, ludashi, pubg, antutu]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N: ${{ inputs.release_number }}
      TAG: ${{ inputs.release_tag }}
      F: ${{ matrix.flavor }}
      PATCH_FROM: 8
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        sparse-checkout: scripts

    - name: Download the new ${{ matrix.flavor }} APK
      uses: actions/download-artifact@v4
      with:
        name: Bannerlator-${{ inputs.release_number }}-${{ matrix.flavor }}
        path: new

    - name: Make and check the patches
      run: |
        set -euo pipefail
        NEW="new/Bannerlator-${N}-${F}.apk"
        mkdir -p patches old
        echo '{}' > "patches/patches-${F}.json"
        gh release list -R "$GITHUB_REPOSITORY" --limit 40 --json tagName -q '.[].tagName' | grep -vxF "$TAG" > tags.txt || true
        made=0
        while read -r T && [ "$made" -lt "$PATCH_FROM" ]; do
          A=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${T}" \
                -q "[.assets[] | select(.name | test(\"^Bannerlator-.*-${F}\\\\.apk$\")) | .name] | first // empty")
          [ -n "$A" ] || continue
          gh release download "$T" -R "$GITHUB_REPOSITORY" -p "$A" -D old --clobber
          P="Bannerlator-${N}-${F}-from-${T}.bldp"
          echo "== $T ($A)"
          python3 -I scripts/apk_delta.py make "old/$A" "$NEW" "patches/$P"
          if python3 -I scripts/apk_delta.py apply "old/$A" "patches/$P" rebuilt.apk && cmp -s rebuilt.apk "$NEW"; then
            OLD_SHA=$(sha256sum "old/$A" | cut -d' ' -f1)
            jq --arg k "$OLD_SHA" --arg file "$P" --arg from "$T" \
               --arg sha "$(sha256sum "patches/$P" | cut -d' ' -f1)" \
               --argjson size "$(stat -c %s "patches/$P")" \
               '.[$k] = {file:$file, from:$from, size:$size, sha256:$sha}' \
               "patches/patches-${F}.json" > p.tmp && mv p.tmp "patches/patches-${F}.json"
            made=$((made + 1))
          else
            echo "::warning::patch from $T for $F did not rebuild byte-exact, dropped"
            rm -f "patches/$P"
          fi
          rm -f "old/$A" rebuilt.apk
        done < tags.txt
        echo "made $made patches for $F"; cat "patches/patches-${F}.json"
        { echo "### Patches for ${F}"; echo; echo '```json'; cat "patches/patches-${F}.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep them for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: patches-${{ matrix.flavor }}
        path: patches/
        retention-days: 7

  # Phase 2 — collect the built APKs and publish the release + update.json.
  release:
    needs: [notes, build, patches]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.notes.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 20        # for the git-log changelog; no submodules/assets needed here

    - name: Download built APKs
      uses: actions/download-artifact@v4
      with:
        pattern: Bannerlator-${{ inputs.release_number }}-*
        path: dist
        merge-multiple: true   # all 4 flavor APKs land flat in dist/

    - name: List downloaded APKs
      run: ls -la dist/

    - name: Download the release description
      uses: actions/download-artifact@v4
      with:
        name: release-notes
        path: notes

    - name: Download the patches
      # Missing artifacts (a flavor whose patch job failed) are fine: those users get the full APK.
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: patches-*
        path: patches
        merge-multiple: true

    - name: Publish the patches to Bannerlator-updates
      # The .bldp files go to their own repo (one release there per cut, same tag), so this release
      # page keeps only the APKs. Needs secret UPDATES_TOKEN (Contents read/write on that repo).
      # Any failure here only costs this cut its small updates: update.json then lists no patches.
      id: patchrepo
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        [ -n "$GH_TOKEN" ] || { echo "::warning::UPDATES_TOKEN is not set, this release has no small updates"; exit 1; }
        ls patches/*.bldp >/dev/null 2>&1 || { echo "no patches were made"; exit 0; }
        BASE=$(scripts/publish_patches.sh publish "$TAG" patches)
        echo "base=$BASE" >> "$GITHUB_OUTPUT"
        echo "patches published under $BASE"

    - name: Get version info
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "VERSION=$(grep versionName app/build.gradle | head -1 | cut -d '"' -f 2)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

    - name: Generate update.json
      # Drives the in-app updater (UpdateManager). The app fetches this from
      # releases/latest/download/update.json; because make_latest=true +
      # prerelease=false below, only stable cuts ever change it.
      # The short line comes from the notes job (update-summary comment, the release_notes
      # input, or the notes' lead paragraph), read from a file so no quoting can break it.
      # highlights (five short lines for the update pop-up), size (bytes per flavor, shown on
      # the pill and the download card) and publishedAt are read by builds from 3.1.6 on;
      # older builds ignore them.
      env:
        RELEASE_TITLE: ${{ inputs.release_title }}
        PATCH_BASE: ${{ steps.patchrepo.outputs.base }}
      run: |
        VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
        N="${{ inputs.release_number }}"
        NOTES="$(cat notes/short-notes.txt)"
        [ -z "$NOTES" ] && NOTES="$RELEASE_TITLE"
        [ -s notes/highlights.json ] || echo '[]' > notes/highlights.json
        size() { stat -c %s "dist/Bannerlator-${N}-$1.apk" 2>/dev/null || echo 0; }
        jq -n \
          --argjson vc "$VERSION_CODE" \
          --arg vn "$VERSION" \
          --arg notes "$NOTES" \
          --slurpfile hl notes/highlights.json \
          --arg date "$(date -u +%Y-%m-%d)" \
          --argjson sstd "$(size standard)" --argjson slud "$(size ludashi)" \
          --argjson spbg "$(size pubg)" --argjson satu "$(size antutu)" \
          --arg std "Bannerlator-${N}-standard.apk" \
          --arg lud "Bannerlator-${N}-ludashi.apk" \
          --arg pbg "Bannerlator-${N}-pubg.apk" \
          --arg atu "Bannerlator-${N}-antutu.apk" \
          --arg base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release_tag }}" \
          '{versionCode:$vc, versionName:$vn, notes:$notes, highlights:$hl[0], publishedAt:$date, minSupported:1,
            apk:{"com.winlator.banner":$std,"com.ludashi.benchmark":$lud,"com.tencent.ig":$pbg,"com.antutu.ABenchMark":$atu},
            apkUrl:{"com.winlator.banner":($base+"/"+$std),"com.ludashi.benchmark":($base+"/"+$lud),
                    "com.tencent.ig":($base+"/"+$pbg),"com.antutu.ABenchMark":($base+"/"+$atu)},
            size:{"com.winlator.banner":$sstd,"com.ludashi.benchmark":$slud,"com.tencent.ig":$spbg,"com.antutu.ABenchMark":$satu}}' \
          > update.json
        # Small updates (3.1.6 on): patches = {old APK sha256: {file, url, from, size, sha256}} across all
        # flavors (the sha already says which flavor), apkSha256 = the new APK per package, checked
        # after the rebuild. Builds that don't know the keys download the full APK as before.
        mkdir -p patches
        sha() { sha256sum "dist/Bannerlator-${N}-$1.apk" 2>/dev/null | cut -d' ' -f1; }
        jq -s 'add // {}' patches/patches-*.json 2>/dev/null > patches.json || echo '{}' > patches.json
        # Only patches that actually reached Bannerlator-updates are listed.
        [ -n "$PATCH_BASE" ] || echo '{}' > patches.json
        jq --slurpfile p patches.json \
           --arg base "$PATCH_BASE" \
           --arg hstd "$(sha standard)" --arg hlud "$(sha ludashi)" --arg hpbg "$(sha pubg)" --arg hatu "$(sha antutu)" \
           '.apkSha256 = {"com.winlator.banner":$hstd,"com.ludashi.benchmark":$hlud,"com.tencent.ig":$hpbg,"com.antutu.ABenchMark":$hatu}
            | .patches = ($p[0] | map_values(. + {url: ($base + "/" + .file)}))' \
           update.json > u.tmp && mv u.tmp update.json
        echo "Generated update.json:"; cat update.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_title }}
        # Body = the assembled house-layout description (docs/releases/<number>.md +
        # the change list since the previous stable). It already opens with the centered
        # logo + badges: do NOT prepend a second logo or a raw `git log` table here.
        body_path: notes/release-body.md
        files: |
          dist/Bannerlator-${{ inputs.release_number }}-standard.apk
          dist/Bannerlator-${{ inputs.release_number }}-ludashi.apk
          dist/Bannerlator-${{ inputs.release_number }}-pubg.apk
          dist/Bannerlator-${{ inputs.release_number }}-antutu.apk
          update.json
        prerelease: ${{ inputs.make_prerelease == 'true' }}
        # Only a stable cut becomes "latest"; pre-releases never do, so the
        # default (toggle-off) updater keeps pointing at the last stable.
        make_latest: ${{ inputs.make_prerelease != 'true' }}

    - name: Publish the manifest branch
      # The app (3.1.6 on) reads update.json / update-pre.json raw from the orphan `manifest`
      # branch: no download counter (the release asset above counted every check as a download)
      # and no API rate limit. update-pre.json is written on every cut, update.json on stable
      # cuts only, so the prerelease toggle and the stable channel keep their meaning. The
      # release asset stays attached for installs older than this code. Runs after the release
      # exists, so the absolute apkUrl entries never point at a release that is not there yet.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.release_tag }}
        PRE: ${{ inputs.make_prerelease }}
      run: |
        set -e
        mkdir manifest-wt && cd manifest-wt
        git init -q
        git config user.name "The412Banner"
        git config user.email "the412banner@users.noreply.github.com"
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git fetch -q --depth 1 origin manifest 2>/dev/null; then
          git checkout -q -b manifest FETCH_HEAD
        else
          git checkout -q --orphan manifest
          printf '%s\n' "# Bannerlator update manifests" "" \
            "Written by release.yml on every cut; read raw by the in-app updater." \
            "- update.json: the latest STABLE release" \
            "- update-pre.json: the latest release of any kind (prerelease channel)" > README.md
        fi
        cp ../update.json update-pre.json
        [ "$PRE" = "true" ] || cp ../update.json update.json
        git add -A
        git commit -q -m "manifest: ${TAG}" || { echo "manifest unchanged"; exit 0; }
        git push -q origin manifest
        echo "manifest branch updated for ${TAG}"

    - name: Prune old patch releases
      # Last, so no live manifest ever points at a deleted patch. Keeps this cut's patches and the
      # current stable's (update.json still names it after a prerelease cut); older ones go.
      if: ${{ steps.patchrepo.outputs.base != '' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        BL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        STABLE=$(GH_TOKEN="$BL_TOKEN" gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
        echo "keeping patch releases $TAG and $STABLE"
        scripts/publish_patches.sh prune "$TAG" "$STABLE"
