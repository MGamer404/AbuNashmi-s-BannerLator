# Bake an AIO Graphics Test release into the container template, server-side.
#
# New containers get their Windows tools from app/src/main/assets/container_pattern_common.tzst
# (84 MB, in git). This swaps the two v2 exes under drive_c/AIO Graphics Test v2/ for the ones
# attached to an AIO-Graphics-Test release and commits the re-baked template to a branch, so the
# 84 MB upload happens on the runner instead of from a phone. Only the two exes change: every other
# entry stays byte-identical, the swapped exes carry their siblings' owner and mode, and the entry
# count must not change. Existing containers keep the exe they were created with.
name: Bake AIO Graphics Test into the container template

on:
  workflow_dispatch:
    inputs:
      aio_tag:
        description: 'AIO-Graphics-Test release tag to bake (e.g. 2.1.0)'
        required: true
      target_branch:
        description: 'Branch to commit the re-baked template to (must be the branch this runs on)'
        required: true

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_branch }}
        fetch-depth: 1

    - name: Swap the AIO v2 exes inside the template
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.aio_tag }}
      run: |
        set -euo pipefail
        T=app/src/main/assets/container_pattern_common.tzst
        D="home/xuser/.wine/drive_c/AIO Graphics Test v2"
        mkdir -p dl "stage/$D"
        gh release download "$TAG" -R The412Banner/AIO-Graphics-Test \
          -p 'AIO-Graphics-Test-32bit.exe' -p 'AIO-Graphics-Test-64bit.exe' -D dl
        ls -l dl
        sha256sum dl/*.exe
        MT=$(gh release view "$TAG" -R The412Banner/AIO-Graphics-Test --json publishedAt --jq .publishedAt)
        zstd -dc "$T" > pattern.tar
        before=$(tar tf pattern.tar | wc -l)
        echo "before:"; tar tvf pattern.tar --numeric-owner | grep "AIO Graphics Test v2/"
        tar --delete -f pattern.tar "$D/AIO-Graphics-Test-32bit.exe" "$D/AIO-Graphics-Test-64bit.exe"
        cp dl/AIO-Graphics-Test-32bit.exe dl/AIO-Graphics-Test-64bit.exe "stage/$D/"
        tar --append -f pattern.tar --format=gnu -C stage \
          --owner=10250 --group=10250 --numeric-owner --mode=0640 --mtime="$MT" \
          "$D/AIO-Graphics-Test-32bit.exe" "$D/AIO-Graphics-Test-64bit.exe"
        after=$(tar tf pattern.tar | wc -l)
        echo "after:"; tar tvf pattern.tar --numeric-owner | grep "AIO Graphics Test v2/"
        [ "$before" = "$after" ] || { echo "entry count changed: $before -> $after"; exit 1; }
        for b in 32 64; do
          got=$(tar xOf pattern.tar "$D/AIO-Graphics-Test-${b}bit.exe" | sha256sum | cut -c1-64)
          want=$(sha256sum "dl/AIO-Graphics-Test-${b}bit.exe" | cut -c1-64)
          [ "$got" = "$want" ] || { echo "${b}-bit exe in the template does not match the release"; exit 1; }
        done
        zstd -19 -T0 -q -f pattern.tar -o "$T"
        zstd -lv "$T" | head -8
        ls -l "$T"
        echo "entries: $after"

    - name: Commit the re-baked template
      env:
        TAG: ${{ inputs.aio_tag }}
        BRANCH: ${{ inputs.target_branch }}
      run: |
        set -euo pipefail
        git config user.name "The412Banner"
        git config user.email "the412banner@users.noreply.github.com"
        git add app/src/main/assets/container_pattern_common.tzst
        git commit -m "Bake AIO Graphics Test ${TAG} into the container pattern (drive_c/AIO Graphics Test v2)"
        git push origin "HEAD:${BRANCH}"
        git log --oneline -1
