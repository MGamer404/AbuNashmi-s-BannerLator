name: Build proot (Termux fork, NDK)

# proot for the Linux runtime: Termux's fork at the exact version that runs on our devices via
# proot-distro, built with the NDK against Termux's own talloc, and made self-contained
# (libtalloc.so beside it, RUNPATH $ORIGIN) so it ships as prebuilt jniLibs.
#
# Why not the tree in app/src/main/cpp/proot: on device it fails at the first exec whatever NDK
# builds it (execve returns ENOSYS/EFAULT, then PEEKDATA EIO) — it is an old snapshot of this
# fork, thousands of lines behind in the ptrace/exec core — while the Termux binary of this
# version works on the same rootfs.
#
# The patches under tools/proot/patches (see tools/proot/PATCHES.md) go on top of that source,
# in order, before the build; one that does not apply fails the build.

on:
  push:
    branches:
      - 'feat/linux-gamescope-runtime'
    paths:
      - '.github/workflows/build-proot.yml'
      - 'tools/proot/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOT_VERSION: 5.1.107.92
  TALLOC_DEB: libtalloc_2.4.3_aarch64.deb

jobs:
  proot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK 27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Fetch the Termux proot fork and Termux's talloc
        run: |
          set -e
          sudo apt-get install -y -qq patchelf >/dev/null
          curl -fsSL --retry 5 -o proot.zip "https://github.com/termux/proot/archive/v${PROOT_VERSION}.zip"
          unzip -q proot.zip && mv "proot-${PROOT_VERSION}" proot-src
          # Termux's own libtalloc for aarch64: headers to build against, the library to ship.
          mkdir -p talloc && cd talloc
          IDX=$(curl -fsSL --retry 5 "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages")
          DEB=$(printf '%s\n' "$IDX" | awk '/^Package: libtalloc$/{f=1} f&&/^Filename:/{print $2; exit}')
          echo "talloc deb: $DEB"
          curl -fsSL --retry 5 -o talloc.deb "https://packages.termux.dev/apt/termux-main/$DEB"
          ar x talloc.deb && tar -xf data.tar.*
          cd ..
          # Deliberately NOT libandroid-shmem. PROOT_WITH_LIBANDROID_SHMEM sets
          # shm_use_libandroid in sysvipc.c:166, which sends every shmget/shmat through
          # libandroid-shmem's ashmem path instead of proot's own System V emulation - and that
          # is what aborts a GTK client on the first icon it loads. The Termux binary that holds
          # a session is built without it: its only NEEDED are libtalloc.so.2 and libc.so.

      - name: Apply the patches under tools/proot/patches
        run: |
          set -euo pipefail
          # In order, each dry-run with no fuzz against the tree it will land on before it is
          # applied: the first one that does not apply, or is already in, fails the build here
          # naming itself, so a proot missing part of the set is never packaged. GNU patch, not
          # git apply: proot-src sits inside this checkout, and git apply run in there takes the
          # patch's paths as relative to the checkout, finds nothing under proot-src and reports
          # success having changed nothing. (From The412Banner/DroidDeck.)
          n=0
          for p in tools/proot/patches/*.patch; do
            echo "applying $(basename "$p")"
            if ! patch -p1 -F0 --forward --dry-run -d proot-src < "$p"; then
              echo "::error file=$p::does not apply to termux/proot v${PROOT_VERSION}"
              exit 1
            fi
            patch -p1 -F0 --forward --no-backup-if-mismatch -d proot-src < "$p"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no patches found under tools/proot/patches"; exit 1; }
          echo "$n patches applied"

      - name: Build
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TAL=$(cd "$(dirname "$(find talloc -name talloc.h | head -1)")" && pwd)
          TLIB=$(cd "$(dirname "$(find talloc -name 'libtalloc.so.2' | head -1)")" && pwd)
          # Ship it under its SONAME. Linking against a copy called libtalloc.so does not change
          # what gets recorded as NEEDED - the SONAME does - so a file called libtalloc.so is a
          # library the loader will never find: "library libtalloc.so.2 not found".
          mkdir -p out/arm64-v8a && cp "$TLIB/libtalloc.so.2" out/arm64-v8a/libtalloc.so.2
          make -C proot-src/src -j"$(nproc)" \
            CC="$BIN/aarch64-linux-android26-clang" \
            STRIP="$BIN/llvm-strip" OBJCOPY="$BIN/llvm-objcopy" OBJDUMP="$BIN/llvm-objdump" \
            CPPFLAGS="-D_GNU_SOURCE -Wno-error=implicit-function-declaration -I. -I$TAL -DARG_MAX=131072 -DVERSION=\"${PROOT_VERSION}\"" \
            LDFLAGS="-L$PWD/out/arm64-v8a -l:libtalloc.so.2 -Wl,-z,noexecstack -Wl,-rpath,\$ORIGIN" \
            PROOT_UNBUNDLE_LOADER=/nonexistent proot loader
          cp proot-src/src/proot out/arm64-v8a/libproot.so
          cp proot-src/src/loader/loader out/arm64-v8a/libproot-loader.so
          patchelf --set-rpath '$ORIGIN' out/arm64-v8a/libproot.so
          # The patched seccomp path is only worth shipping if the build probed seccomp and
          # process_vm in; and filtered_sysnum_flags is the patch set's one global symbol, the
          # marker that tells this binary from Termux's on a device.
          grep -q '^#define HAVE_SECCOMP_FILTER' proot-src/src/build.h || { echo "::error::proot was built without seccomp filtering"; exit 1; }
          grep -q '^#define HAVE_PROCESS_VM' proot-src/src/build.h || { echo "::error::proot was built without process_vm"; exit 1; }
          "$BIN/llvm-nm" out/arm64-v8a/libproot.so | grep -q ' T filtered_sysnum_flags$' || { echo "::error::the patch set's marker symbol is missing from libproot.so"; exit 1; }
          "$BIN/llvm-readelf" -d out/arm64-v8a/libproot.so | grep -E "NEEDED|RUNPATH"
          "$BIN/llvm-readelf" -h out/arm64-v8a/libproot-loader.so | grep -E "Type|Entry"
          ls -la out/arm64-v8a
          for f in out/arm64-v8a/*.so; do echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"; done | tee out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: proot-termux-${{ github.run_number }}
          path: out/
          compression-level: 0
          retention-days: 30
